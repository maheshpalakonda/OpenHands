apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: openhands-hpa
  namespace: openhands

spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: openhands-rollout

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
