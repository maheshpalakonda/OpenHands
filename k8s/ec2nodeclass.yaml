apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass

metadata:
  name: openhands-nodeclass

spec:
  amiFamily: AL2023

  role: KarpenterNodeRole-openhands-cluster

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: openhands-cluster

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: openhands-cluster

  tags:
    Name: openhands-karpenter-node
    Environment: Production
    Project: OpenHands
